<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChartManager Tests - Sistem Manajemen Pelanggan Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .console {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            overflow-y: auto;
            max-height: 600px;
            border: 1px solid #404040;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .console .success {
            color: #4ec9b0;
        }
        
        .console .error {
            color: #f48771;
        }
        
        .console .info {
            color: #9cdcfe;
        }
        
        .console .warning {
            color: #ce9178;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button.secondary {
            background-color: #95a5a6;
        }
        
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        
        .test-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 4px;
            border-left: 4px solid #3498db;
        }
        
        .test-summary h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #2c3e50;
        }
        
        .passed {
            color: #27ae60;
            font-weight: bold;
        }
        
        .failed {
            color: #e74c3c;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .console {
                font-size: 11px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 ChartManager Module Tests</h1>
        <div class="subtitle">Unit tests for 5 chart data processing methods</div>
        
        <div class="controls">
            <button onclick="runTests()">▶️ Run All Tests</button>
            <button class="secondary" onclick="clearConsole()">🗑️ Clear Console</button>
        </div>
        
        <div class="console" id="console"></div>
        <div class="test-summary" id="summary" style="display: none;">
            <h3>📊 Test Summary</h3>
            <div class="summary-item">
                <span>Total Tests:</span>
                <span id="total">0</span>
            </div>
            <div class="summary-item">
                <span>Passed:</span>
                <span class="passed" id="passedCount">0</span>
            </div>
            <div class="summary-item">
                <span>Failed:</span>
                <span class="failed" id="failedCount">0</span>
            </div>
        </div>
    </div>
    
    <!-- Required modules in order -->
    <script src="../js/storage-api.js"></script>
    <script src="../js/calculation-engine.js"></script>
    <script src="../js/customer-manager.js"></script>
    <script src="../js/chart-manager.js"></script>
    
    <script>
        // Console output capture
        const consoleElement = document.getElementById('console');
        const summaryElement = document.getElementById('summary');
        
        let testStats = {
            total: 0,
            passed: 0,
            failed: 0
        };
        
        // Override console methods
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog(...args);
            const message = args.join(' ');
            appendToConsole(message, 'info');
        };
        
        console.error = function(...args) {
            originalError(...args);
            const message = args.join(' ');
            appendToConsole(message, 'error');
        };
        
        function appendToConsole(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('id-ID');
            const line = `[${timestamp}] ${message}`;
            
            const span = document.createElement('div');
            span.className = type;
            span.textContent = line;
            consoleElement.appendChild(span);
            consoleElement.scrollTop = consoleElement.scrollHeight;
        }
        
        function clearConsole() {
            consoleElement.innerHTML = '';
            testStats = { total: 0, passed: 0, failed: 0 };
            summaryElement.style.display = 'none';
        }
        
        async function runTests() {
            clearConsole();
            appendToConsole('Starting ChartManager tests...', 'info');
            appendToConsole('', 'info');
            
            try {
                // Load chart-manager test file
                await import('../tests/chart-manager.test.js');
                
                // Wait a bit for async tests to complete
                setTimeout(() => {
                    updateSummary();
                }, 1000);
            } catch (error) {
                appendToConsole(`Error loading tests: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function updateSummary() {
            // Parse console output to count test results
            const consoleText = consoleElement.innerText;
            
            // Count passed tests (✓ symbol)
            const passedMatches = consoleText.match(/✓/g) || [];
            testStats.passed = passedMatches.length;
            
            // Count failed tests (✗ symbol)
            const failedMatches = consoleText.match(/✗/g) || [];
            testStats.failed = failedMatches.length;
            
            testStats.total = testStats.passed + testStats.failed;
            
            // Update summary display
            if (testStats.total > 0) {
                document.getElementById('total').textContent = testStats.total;
                document.getElementById('passedCount').textContent = testStats.passed;
                document.getElementById('failedCount').textContent = testStats.failed;
                summaryElement.style.display = 'block';
            }
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', function() {
            appendToConsole('Page loaded. Click "Run All Tests" to start testing.', 'info');
        });
    </script>
</body>
</html>
