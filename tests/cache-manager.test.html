<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Manager Tests - Task 15.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .test-section {
            margin-bottom: 30px;
        }
        
        .test-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .test-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .test-pass {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .test-fail {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .test-icon {
            font-weight: bold;
            font-size: 16px;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }
        
        .summary h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .summary-stat {
            display: inline-block;
            margin-right: 20px;
            font-size: 14px;
        }
        
        .summary-stat strong {
            color: #667eea;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-banner {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
        
        .error-banner {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Cache Manager Tests</h1>
            <p>Task 15.1: Data Caching Strategy Implementation</p>
        </div>
        
        <div class="content">
            <div id="test-output" class="loading">
                <div class="spinner"></div>
                <p>Loading tests...</p>
            </div>
        </div>
    </div>
    
    <!-- Load CacheManager -->
    <script src="../js/cache-manager.js"></script>
    
    <!-- Load test suite -->
    <script src="cache-manager.test.js"></script>
    
    <script>
        // Intercept console output to display in HTML
        const testOutput = document.getElementById('test-output');
        const originalLog = console.log;
        const originalError = console.error;
        
        let htmlOutput = '';
        let currentSection = null;
        let passCount = 0;
        let failCount = 0;
        
        console.log = function(...args) {
            const message = args.join(' ');
            originalLog(...args);
            processOutput(message, 'log');
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            originalError(...args);
            processOutput(message, 'error');
        };
        
        function processOutput(message, type) {
            if (message.includes('='.repeat(10))) {
                // Section divider
                return;
            }
            
            if (message.includes('Test Summary')) {
                displaySummary(message);
                return;
            }
            
            if (message.startsWith('✓')) {
                passCount++;
                htmlOutput += createTestItem(message, 'pass');
            } else if (message.startsWith('✗')) {
                failCount++;
                htmlOutput += createTestItem(message, 'fail');
            } else if (message.includes('Tests') && message.includes('-'.repeat(5))) {
                currentSection = message;
                htmlOutput += `<div class="test-section"><h2>${message}</h2>`;
            } else if (type === 'error' && !message.includes('[CacheManager]')) {
                htmlOutput += createTestItem(message, 'fail');
            }
            
            updateDisplay();
        }
        
        function createTestItem(message, status) {
            const icon = status === 'pass' ? '✓' : '✗';
            const className = status === 'pass' ? 'test-pass' : 'test-fail';
            const cleanMessage = message.replace(/^[✓✗]\s+/, '').replace(/\s+\n/g, '');
            return `<div class="test-item ${className}"><span class="test-icon">${icon}</span>${cleanMessage}</div>`;
        }
        
        function displaySummary(message) {
            htmlOutput += '</div>'; // Close last section
            htmlOutput += `
                <div class="summary">
                    <h3>📊 Test Results Summary</h3>
                    <div class="summary-stat">Passed: <strong style="color: #28a745;">${passCount}</strong></div>
                    <div class="summary-stat">Failed: <strong style="color: #dc3545;">${failCount}</strong></div>
                    <div class="summary-stat">Total: <strong>${passCount + failCount}</strong></div>
                </div>
            `;
            
            if (failCount === 0) {
                htmlOutput = `
                    <div class="success-banner">
                        <strong>✓ All tests passed!</strong><br>
                        Cache Manager is working correctly with ${passCount} test cases.
                    </div>
                ` + htmlOutput;
            }
            
            updateDisplay();
        }
        
        function updateDisplay() {
            testOutput.innerHTML = htmlOutput;
        }
    </script>
</body>
</html>
